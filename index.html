<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080706">
<title>Połącz konto Kick — LjayLIVE</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 40%,#351b06,#080706 75%);color:#f7f4ef;font-family:system-ui,sans-serif}
.panel{width:min(92vw,510px);padding:30px 25px;text-align:center;border:1px solid #ff9a3544;border-radius:25px;background:#100d0bf2;box-shadow:0 24px 90px #0009;animation:in .7s both}
.eyebrow{font-size:11px;letter-spacing:.24em;color:#ffad50;font-weight:800}
.logo{height:210px;display:grid;place-items:center;position:relative;overflow:visible}
.split-logo{position:relative;width:min(100%,250px);height:200px;display:block}
.half{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 22px #ff8a0066);will-change:transform,opacity}
.half.left{clip-path:inset(0 50% 0 0);animation:split-left 3.4s cubic-bezier(.2,.7,.2,1) both}
.half.right{clip-path:inset(0 0 0 50%);animation:split-right 3.4s cubic-bezier(.2,.7,.2,1) both}
h1{font-size:clamp(26px,6vw,34px);margin:6px 0 10px}
h1 span{color:#ff9418}
p{color:#aaa29a;font-size:14px;line-height:1.65;margin:0 auto 24px;max-width:365px}
.connect{display:block;padding:17px 12px;border-radius:13px;background:linear-gradient(110deg,#ffad18,#ff6b00);color:#201004;font-weight:850;text-decoration:none}
.note{color:#aaa29a;font-size:12px;margin-top:16px}
.note b{color:#53fc18}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes split-left{0%{opacity:0;transform:translateX(0) scale(.96);filter:blur(8px)}18%{opacity:1;filter:blur(0)}42%{opacity:1;transform:translateX(0) scale(1)}68%{opacity:1;transform:translateX(-115px) rotate(-7deg);filter:blur(1px)}100%{opacity:0;transform:translateX(-160px) rotate(-12deg);filter:blur(6px)}}
@keyframes split-right{0%{opacity:0;transform:translateX(0) scale(.96);filter:blur(8px)}18%{opacity:1;filter:blur(0)}42%{opacity:1;transform:translateX(0) scale(1)}68%{opacity:1;transform:translateX(115px) rotate(7deg);filter:blur(1px)}100%{opacity:0;transform:translateX(160px) rotate(12deg);filter:blur(6px)}}
@media(max-width:420px){@keyframes split-left{0%{opacity:0;transform:translateX(0) scale(.96);filter:blur(8px)}18%{opacity:1;filter:blur(0)}42%{opacity:1;transform:translateX(0) scale(1)}68%{opacity:1;transform:translateX(-82px) rotate(-7deg);filter:blur(1px)}100%{opacity:0;transform:translateX(-120px) rotate(-12deg);filter:blur(6px)}}@keyframes split-right{0%{opacity:0;transform:translateX(0) scale(.96);filter:blur(8px)}18%{opacity:1;filter:blur(0)}42%{opacity:1;transform:translateX(0) scale(1)}68%{opacity:1;transform:translateX(82px) rotate(7deg);filter:blur(1px)}100%{opacity:0;transform:translateX(120px) rotate(12deg);filter:blur(6px)}}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important}}
</style>
</head>
<body>
<main class="panel">
<div class="eyebrow">KICK ACCOUNT LINK</div>
<div class="logo" aria-label="Logo LjayLIVE rozdziela się na dwie połowy i znika">
<div class="split-logo">
<img class="half left" src="./ljay-logo.png" alt="">
<img class="half right" src="./ljay-logo.png" alt="">
</div>
</div>
<h1>Połącz konto <span>Kick</span></h1>
<p>Autoryzacja właściciela kanału <strong>@LjayLIVE</strong>. Zaloguj się na właściwe konto Kick, aby bezpiecznie połączyć integrację.</p>
<a class="connect" href="https://kick-auth.michalkowalczyk489.workers.dev/ljay-live/start">Połącz konto Kick ↗</a>
<div class="note">Logowanie odbywa się przez <b>Kick OAuth</b>. Tokeny nie są wpisywane na tej stronie.</div>
</main>
</body>
</html>
